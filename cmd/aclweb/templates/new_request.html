{{template "base.html" .}}
{{define "body"}}
<nav>
  <strong>ACL 审批系统</strong>
  <a href="/requests">变更请求</a>
  <span class="sep"></span>
  <span style="font-size:.85rem">{{.Actor.Username}}</span>
</nav>
<div class="container">
  <h2>新建 ACL 放行申请</h2>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <div class="card">
    <form method="post" action="/requests/new">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <div class="form-row">
        <label>协议 *</label>
        <select name="protocol" required>
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
          <option value="ip">IP (任意)</option>
        </select>
      </div>
      <div class="form-row">
        <label>目的 IP *</label>
        <input name="dst_ip" placeholder="10.0.0.1" required>
      </div>
      <div class="form-row">
        <label>目的 wildcard（/32 留空则填 0.0.0.0）</label>
        <input name="dst_wildcard" value="0.0.0.0" placeholder="0.0.0.0">
      </div>
      <div class="form-row">
        <label>目的端口（可选）</label>
        <div style="display:flex;gap:8px">
          <select name="dst_port_op" style="width:120px">
            <option value="">— 不限 —</option>
            <option value="eq">eq</option>
            <option value="gt">gt</option>
            <option value="lt">lt</option>
          </select>
          <input name="dst_port_val" type="number" min="1" max="65535" placeholder="端口号">
        </div>
      </div>
      <div class="form-row">
        <label>源 IP（留空 = any）</label>
        <input name="src_ip" placeholder="留空表示 any">
      </div>
      <div class="form-row">
        <label>申请理由 *</label>
        <textarea name="reason" rows="3" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">提交申请</button>
      <a href="/requests" class="btn btn-outline" style="margin-left:8px">取消</a>
    </form>
  </div>
</div>
{{end}}
