{{template "base.html" .}}
{{define "body"}}
<nav>
  <strong>ACL 审批系统</strong>
  <a href="/requests">变更请求</a>
  <a href="/admin/users">用户管理</a>
  <span class="sep"></span>
  <span style="font-size:.85rem">{{.Actor.(*auth.User).Username}}</span>
</nav>
<div class="container">
  <h2>用户管理</h2>
  <div class="card" style="padding:0">
    <table>
      <tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr>
      {{range .Users}}
      <tr>
        <td>{{.ID}}</td>
        <td>{{.Username}}</td>
        <td>{{.Role}}</td>
        <td>{{if .Active}}<span class="badge badge-active">启用</span>{{else}}<span class="badge badge-rejected">停用</span>{{end}}</td>
        <td>
          <form method="post" action="/admin/users/toggle" style="display:inline">
            <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
            <input type="hidden" name="user_id" value="{{.ID}}">
            <input type="hidden" name="active" value="{{if .Active}}0{{else}}1{{end}}">
            <button class="btn btn-outline" style="padding:3px 8px;font-size:.8rem">{{if .Active}}停用{{else}}启用{{end}}</button>
          </form>
        </td>
      </tr>
      {{end}}
    </table>
  </div>
  <div class="card">
    <h3 style="margin-top:0">新建用户</h3>
    <form method="post" action="/admin/users/new">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="form-row" style="flex:1;min-width:160px">
          <label>用户名</label><input name="username" required>
        </div>
        <div class="form-row" style="flex:1;min-width:160px">
          <label>密码（≥12位）</label><input name="password" type="password" required>
        </div>
        <div class="form-row" style="width:140px">
          <label>角色</label>
          <select name="role">
            <option value="operator">operator</option>
            <option value="approver">approver</option>
            <option value="viewer">viewer</option>
            <option value="admin">admin</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">创建</button>
    </form>
  </div>
</div>
{{end}}
