<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACL 审批系统</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#222}
    nav{background:#1a237e;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px}
    nav a{color:#fff;text-decoration:none;font-size:.9rem}
    nav a:hover{text-decoration:underline}
    nav .sep{flex:1}
    .container{max-width:960px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:20px;margin-bottom:16px}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee}
    th{background:#f0f0f0}
    .btn{display:inline-block;padding:7px 16px;border-radius:4px;border:none;cursor:pointer;font-size:.9rem;text-decoration:none}
    .btn-primary{background:#1a237e;color:#fff}.btn-primary:hover{background:#283593}
    .btn-danger{background:#c62828;color:#fff}.btn-danger:hover{background:#b71c1c}
    .btn-success{background:#2e7d32;color:#fff}.btn-success:hover{background:#1b5e20}
    .btn-outline{background:#fff;border:1px solid #999;color:#333}.btn-outline:hover{background:#f0f0f0}
    .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.78rem;font-weight:600}
    .badge-pending{background:#fff9c4;color:#f57f17}
    .badge-approved{background:#e8f5e9;color:#2e7d32}
    .badge-active{background:#e3f2fd;color:#1565c0}
    .badge-rejected{background:#fce4ec;color:#880e4f}
    .badge-dispatching,.badge-inconsistent,.badge-dispatch_failed{background:#fbe9e7;color:#bf360c}
    .badge-drift{background:#ede7f6;color:#4a148c}
    .err{color:#c62828;padding:8px;background:#fce4ec;border-radius:4px;margin-bottom:12px}
    .flash{color:#1b5e20;padding:8px;background:#e8f5e9;border-radius:4px;margin-bottom:12px}
    label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem}
    input,select,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:.9rem}
    .form-row{margin-bottom:14px}
    pre{background:#f5f5f5;padding:12px;border-radius:4px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap}
    pre .add{color:#2e7d32}
    pre .del{color:#c62828}
    /* The side-by-side diff. Colour is not the only signal: every changed row
       also carries a marker in its gutter, for printing and for anyone who does
       not separate red from green. */
    /* The diff is the one thing on the page that is read line by line, so it is
       allowed out of the 960px column and up to the width of the window. It is
       centred on the page rather than on its container, which is the same point
       because the container is centred too. */
    /* Wide enough for the longest line and no wider. Fixing the width at the
       window's instead left half the card empty whenever the rules were short,
       which is most of the time. The floor is the ordinary column width so the
       card never looks narrower than the ones above it. */
    .widen{width:fit-content;min-width:100%;max-width:min(1800px,calc(100vw - 32px));margin-left:50%;transform:translateX(-50%)}
    /* One scrollbar for both sides. A wrapped line breaks the one-line-per-rule
       reading that makes a diff worth showing, and wrapping only the right-hand
       side pushes the two columns out of step, so lines are never wrapped and a
       line too long for the window is reached by scrolling the whole table —
       which keeps the two sides aligned while it moves. */
    .sbswrap{overflow-x:auto}
    table.sbs{width:max-content;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;border:1px solid #ddd}
    table.sbs col.no{width:44px}
    table.sbs col.mark{width:18px}
    table.sbs th{background:#fafafa;text-align:left;padding:6px 8px;font-family:system-ui,sans-serif;font-size:.82rem;border-bottom:1px solid #ddd}
    table.sbs td{padding:2px 6px;vertical-align:top;white-space:pre;word-break:normal;border-bottom:1px solid #f0f0f0}
    table.sbs td.no{text-align:right;color:#999;background:#fafafa;user-select:none;font-size:.72rem}
    table.sbs td.mark{text-align:center;color:#666;user-select:none;font-weight:700}
    table.sbs td.side{border-left:1px solid #eee}
    table.sbs tr.add td.r,table.sbs tr.replace td.r{background:#e6ffed}
    table.sbs tr.remove td.l,table.sbs tr.replace td.l{background:#ffeef0}
    table.sbs tr.add td.l,table.sbs tr.remove td.r{background:#fbfbfb}
    table.sbs tr.skip td{background:#f5f7ff;color:#5c6bc0;text-align:center;font-size:.74rem;padding:4px}
    .diff-legend{font-size:.82rem;color:#555;margin:0 0 10px}
    .diff-legend .n-add{color:#2e7d32;font-weight:600}
    .diff-legend .n-del{color:#c62828;font-weight:600}
  </style>
</head>
<body>
{{block "body" .}}{{end}}
</body>
</html>
