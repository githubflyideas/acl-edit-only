{{template "base.html" .}}
{{define "body"}}
<nav>
  <strong>ACL 审批系统</strong>
  <a href="/requests">变更请求</a>
  <span class="sep"></span>
  <span style="font-size:.85rem">{{.Actor.Username}}</span>
</nav>
<div class="container">
  <h2>新建 ACL 放行申请</h2>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <div class="card">
    <form method="post" action="/requests/new">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <div class="form-row">
        <label>协议 *</label>
        <select name="protocol" required>
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
          <option value="ip">IP (任意)</option>
        </select>
      </div>
      <div class="form-row">
        <label>目的 IP *</label>
        <input name="dst_ip" placeholder="10.0.0.1" required>
      </div>
      <div class="form-row">
        <label>目的地址范围</label>
        <select name="dst_wildcard" id="dst_wildcard_sel" onchange="wildcardChanged()">
          <option value="0.0.0.0" selected>单台主机（只放行上面这一个 IP）</option>
          <option value="0.0.0.255">整个 /24 网段（后 8 位任意）</option>
          <option value="0.0.255.255">整个 /16 网段（后 16 位任意）</option>
          <option value="custom">其他（手工填 wildcard）</option>
        </select>
        <input name="dst_wildcard_custom" id="dst_wildcard_custom" placeholder="例如 0.0.0.15"
               style="display:none;margin-top:6px">
      </div>
      <div class="form-row">
        <label>目的端口（可选）</label>
        <div style="display:flex;gap:8px">
          <select name="dst_port_op" style="width:150px">
            <option value="eq" selected>等于（eq）</option>
            <option value="">— 不限端口 —</option>
          </select>
          <input name="dst_port_val" type="number" min="1" max="65535" placeholder="端口号">
        </div>
      </div>
      <div class="form-row">
        <label>源 IP（留空 = any）</label>
        <input name="src_ip" placeholder="留空表示 any">
      </div>
      <div class="form-row">
        <label>申请理由 *</label>
        <textarea name="reason" rows="3" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">提交申请</button>
      <a href="/requests" class="btn btn-outline" style="margin-left:8px">取消</a>
    </form>
  </div>
</div>
<script>
// The three named choices cover every request this tool has been asked for, but
// a wildcard is a wildcard and the switch accepts any of them, so the field
// stays reachable rather than being designed out.
function wildcardChanged() {
  const sel = document.getElementById('dst_wildcard_sel');
  const box = document.getElementById('dst_wildcard_custom');
  const custom = sel.value === 'custom';
  box.style.display = custom ? '' : 'none';
  box.name = custom ? 'dst_wildcard' : 'dst_wildcard_custom';
  sel.name = custom ? 'dst_wildcard_sel' : 'dst_wildcard';
  if (custom) box.focus();
}
</script>
{{end}}
